plugins {
    // Instructions: https://github.com/researchgate/gradle-release
    // Available versions: https://plugins.gradle.org/plugin/net.researchgate.release
    id 'net.researchgate.release' version '3.2.0'
    // Publishing of JAR to Nexus instances (e.g., OSSRH)
    // https://github.com/gradle-nexus/publish-plugin
    id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
}

group = 'edu.kit.datamanager'

println "Running gradle version: $gradle.gradleVersion"
println "Building ${name} version: ${version}"
println "JDK version: ${JavaVersion.current()}"

// for plugin net.researchgate.release
// see https://github.com/researchgate/gradle-release
release {
    //define template for tagging, e.g. v1.0.0
    tagTemplate = 'v${version}'
}

// for plugin io.github.gradle-nexus.publish-plugin
// see https://github.com/gradle-nexus/publish-plugin
nexusPublishing {
    repositories {
        //select sonatype repository as publication destination
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
        }
    }
}

subprojects {
    apply from: rootProject.file('gradle/module-common.gradle')
}

apply from: 'gradle/updateCff.gradle'
