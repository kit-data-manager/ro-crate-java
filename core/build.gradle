/*
 * The Jackson-free core of ro-crate-java.
 *
 * This module must not have any dependency on a concrete JSON library: the
 * neutral JSON tree model talks to a backend (jackson2 or jackson3 module)
 * through the JsonAdapter and validation SPIs, discovered via ServiceLoader.
 */

plugins {
    id 'application'
    id 'jacoco'
}

description = "A library for easy creation and modification of valid RO-Crates (Jackson-free core)."

repositories {
    mavenCentral()
}

dependencies {
    // JUnit setup for testing
    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    // the JSON backend is required to run the tests (provides the JsonAdapter)
    testImplementation project(':jackson2')
    // compare json documents in tests (test scope only; works on JSON strings)
    testImplementation 'com.github.fslev:json-compare:8.4'
    // http client
    implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.14'
    // common file system operations
    implementation group: 'commons-io', name: 'commons-io', version: '2.22.0'
    // read from and write to zip files
    implementation group: 'net.lingala.zip4j', name: 'zip4j', version: '2.11.6'
    // url validator
    implementation group: 'commons-validator', name: 'commons-validator', version: '1.11.0'
    // logging
    implementation group: 'org.slf4j', name: 'slf4j-jdk14', version: '2.0.20'
    // JSON-LD, Zenodo mapping
    implementation group: 'com.apicatalog', name: 'titanium-json-ld', version: '1.7.0'
    implementation 'org.glassfish:jakarta.json:2.0.1'
    // template processing for the preview
    implementation("org.freemarker:freemarker:2.3.35")
    implementation('gg.jte:jte:3.2.4')
}

jacocoTestReport {
    dependsOn test
    reports {
        csv.required = true
        xml.required = true // codecov plugin may depend on xml format report
    }
}

jacoco {
    toolVersion = "0.8.15"
}

// maxParallelForks(2)
// failFast = true

// Task for creating a resource file with the version info
tasks.register("generateVersionProps", WriteProperties) { t ->
    def generatedResourcesDir = project.layout.buildDirectory.dir(["resources", "main"].join(File.separator))
    def outputFile = generatedResourcesDir.map { it.file("version.properties") }

    t.destinationFile = outputFile.get().asFile
    t.property("version", version)
}

tasks.register("generateVersionPropsTest", WriteProperties) { t ->
    def generatedResourcesDir = project.layout.buildDirectory.dir(["resources", "test"].join(File.separator))
    def outputFile = generatedResourcesDir.map { it.file("version.properties") }

    t.destinationFile = outputFile.get().asFile
    t.property("version", version)
}

tasks.register('performanceContextEntitiesBenchmark', JavaExec) {
    description = "Run the contextual entities benchmarks."
    classpath = sourceSets.performanceTest.runtimeClasspath
    mainClass = 'edu.kit.datamanager.ro_crate.singlecratebenchmarks.ContextualEntitiesPerformance'
}

tasks.register('performanceLocalDataEntitiesBenchmark', JavaExec) {
    description = "Run the local data entities benchmarks."
    classpath = sourceSets.performanceTest.runtimeClasspath
    mainClass = 'edu.kit.datamanager.ro_crate.singlecratebenchmarks.LocalDataEntitiesPerformance'
}

tasks.register('performanceRemoteDataEntitiesBenchmark', JavaExec) {
    description = "Run the remote data entities benchmarks."
    classpath = sourceSets.performanceTest.runtimeClasspath
    mainClass = 'edu.kit.datamanager.ro_crate.singlecratebenchmarks.RemoteDataEntitiesPerformance'
}

tasks.register('performanceMixEntitiesBenchmark', JavaExec) {
    description = "Run the mixture of entities benchmarks."
    classpath = sourceSets.performanceTest.runtimeClasspath
    mainClass = 'edu.kit.datamanager.ro_crate.singlecratebenchmarks.MixtureOfEntitiesPerformance'
}

tasks.register('performanceDeletionEntitiesBenchmark', JavaExec) {
    description = "Run the deletion entities benchmarks."
    classpath = sourceSets.performanceTest.runtimeClasspath
    mainClass = 'edu.kit.datamanager.ro_crate.singlecratebenchmarks.DeletionEntitiesPerformance'
}

tasks.register('performanceMultipleCratesBenchmark', JavaExec) {
    description = "Run the multiple crates benchmarks."
    classpath = sourceSets.performanceTest.runtimeClasspath
    mainClass = 'edu.kit.datamanager.ro_crate.multiplecrates.MultipleCratesBenchmark'
}

tasks.register('performanceReadWriteMultipleCratesBenchmark', JavaExec) {
    description = "Run the multiple crates write and read benchmarks."
    classpath = sourceSets.performanceTest.runtimeClasspath
    mainClass = 'edu.kit.datamanager.ro_crate.multiplecrates.MultipleCratesWriteAndRead'
}

compileJava {
    dependsOn generateVersionProps
}

test {
    dependsOn generateVersionPropsTest
    finalizedBy jacocoTestReport
}

sourceSets {
    performanceTest {
        java {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
            srcDirs = ['src/performanceTest/java']
        }
    }
}

configurations {
    performanceTestImplementation.extendsFrom implementation
}
