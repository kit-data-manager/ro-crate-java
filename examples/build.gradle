/*
 * Executable examples for ro-crate-java that double as a behavior-comparison
 * test suite.
 *
 * How it works:
 *
 *  - src/main      the examples written against the current API. They are
 *                  backend-agnostic: they compile against :core only and run
 *                  with whichever JSON backend is on the classpath.
 *  - src/legacy    the same examples written against the released 2.1.2
 *                  artifact (pre-port Jackson API). Kept in a separate source
 *                  set so the two classpaths never mix.
 *
 *  - Every example is a main() that receives an output file path and writes
 *    deterministic, canonical content there.
 *
 *  - For each example and variant (see the `variants` map below) a JavaExec
 *    task runs the example in its own JVM — required, because the JSON
 *    backends register via ServiceLoader and must not share a classpath —
 *    and writes build/examples/<variant>/<Example>.txt.
 *
 *  - The parity test (ParityTest) then asserts that consecutive variants
 *    produce byte-identical output: legacy == current-jackson2 ==
 *    current-jackson3. It derives the variant names from the same `variants`
 *    map (passed as the rocrate.parity.variants system property) and the
 *    example list from the output files, so new examples are covered by just
 *    adding a class and registering it in `exampleClasses` below.
 */

plugins {
    id 'java'
}

ext {
    legacyVersion = '2.1.2'
}

repositories {
    mavenCentral()
}

sourceSets {
    // compiled and run against the released artifact; deliberately not
    // sharing a classpath with the current code
    legacy
}

configurations {
    // runtime-only backend jars for the current examples; deliberately not on
    // the compile classpath so the examples stay backend-agnostic
    jackson2Backend
    jackson3Backend
}

dependencies {
    implementation project(':core')
    // the released artifact exposes Jackson only at runtime scope, so the
    // legacy source set declares the same versions for compilation
    legacyImplementation "edu.kit.datamanager:ro-crate-java:${legacyVersion}"
    legacyImplementation "com.fasterxml.jackson.core:jackson-databind:2.22.1"
    jackson2Backend project(':jackson2')
    jackson3Backend project(':jackson3')

    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

/*
 * The variants to compare. The key is the variant name and is used as
 *   - the output directory: build/examples/<variant>/<Example>.txt,
 *   - the task name fragment: run<Variant><Example>, and
 *   - the variant list handed to ParityTest (in map order).
 * The classpath closure defines the JVM classpath of the variant; classesTask
 * is the task that produces the compiled example classes for it.
 */
def variants = [
    legacy: [
        classesTask: 'legacyClasses',
        classpath  : { sourceSets.legacy.runtimeClasspath },
    ],
    'current-jackson2': [
        classesTask: 'classes',
        classpath  : { sourceSets.main.runtimeClasspath + configurations.jackson2Backend },
    ],
    'current-jackson3': [
        classesTask: 'classes',
        classpath  : { sourceSets.main.runtimeClasspath + configurations.jackson3Backend },
    ],
]

// register every new example here; the parity test picks it up automatically
def exampleClasses = [
    'CreateMinimalCrate',
    'ReadCrate',
    'ModifyCrate',
    'WriteCrate',
    'ValidateCrate',
]

exampleClasses.each { example ->
    variants.each { variant, setup ->
        tasks.register("run${variant.capitalize()}${example}", JavaExec) {
            group = 'examples'
            description = "Runs the ${example} example with the ${variant} variant."
            dependsOn setup.classesTask
            classpath = setup.classpath()
            mainClass = "examples.${example}"
            def outputFile = layout.buildDirectory.file("examples/${variant}/${example}.txt")
            args outputFile.get().asFile.absolutePath
            doFirst {
                outputFile.get().asFile.parentFile.mkdirs()
            }
            outputs.file(outputFile)
        }
    }
}

tasks.named('test') {
    dependsOn exampleClasses.collectMany { example ->
        variants.keySet().collect { variant -> tasks.named("run${variant.capitalize()}${example}") }
    }
    // single source of truth for the variant names used by ParityTest
    systemProperty 'rocrate.parity.variants', variants.keySet().join(',')
}
