/*
 * The Jackson 3 backend of ro-crate-java (tools.jackson, new package/group).
 *
 * The Jackson 3 version follows the requirement of the json-schema-validator
 * backend (networknt 3.0.x builds against Jackson 3.2.x).
 */

plugins {
    id 'java-library'
}

ext {
    jackson3Version = '3.2.1'
    networknt3Version = '3.0.8'
    // this module publishes under its own artifact coordinates
    publishedArtifactId = 'ro-crate-java-jackson3'
}

description = "A library for easy creation and modification of valid RO-Crates (Jackson 3 backend)."

repositories {
    mavenCentral()
}

dependencies {
    api project(':core')
    // JSON object mapping / (de-)serialization
    implementation "tools.jackson.core:jackson-databind:${jackson3Version}"
    // metadata validation, profiles based on JSON schema
    implementation group: "com.networknt", name: "json-schema-validator", version: networknt3Version

    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

apply from: rootProject.file('gradle/module-publishing.gradle')

test {
    // the golden files live in the core test resources; make them visible so
    // the parity test can compare the Jackson 3 output against the same
    // goldens the Jackson 2 backend is verified against
    sourceSets.test.resources.srcDir file('../core/src/test/resources')
}
